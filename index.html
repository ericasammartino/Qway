<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Qway</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page">
      <main class="hero">
        <div class="hero-inner">
          <img class="logo" src="QWAY LOGO.png" alt="Qway logo" />

          <div class="cta-row">
            <a href="#" class="btn btn-primary">Listen now</a>
            <a href="#" class="btn btn-outline">Shop</a>
          </div>

          <p class="tagline">Eastern Progressive Psych Trio from Philly</p>
        </div>
      </main>

      <aside class="right-rail">
        <nav class="section-nav" aria-label="Sections">
          <a href="#" class="section-tab">NEW RELEASE</a>
          <a href="#" class="section-tab">TOUR</a>
          <a href="#" class="section-tab">WATCH</a>
          <a href="#" class="section-tab">LISTEN</a>
          <a href="#" class="section-tab">MERCH</a>
          <a href="#" class="section-tab">CONTACT</a>
        </nav>

        <div class="social-rail" aria-label="Social links">
          <a href="#" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
          <a href="#" aria-label="Spotify"><i class="fa-brands fa-spotify"></i></a>
          <a href="#" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
          <a href="#" aria-label="YouTube"><i class="fa-brands fa-youtube"></i></a>
          <a href="#" aria-label="Bandcamp"><i class="fa-brands fa-bandcamp"></i></a>
          <a href="#" aria-label="Email"><i class="fa-solid fa-envelope"></i></a>
        </div>
      </aside>
    </div>
  </body>
</html>
